# OpenCode Light — alacritty color scheme
# Usage: add this to your ~/.config/alacritty/alacritty.toml
#
#   [general]
#   import = ["~/.config/alacritty/opencode-light.toml"]
#
# (or copy the [colors.*] blocks below directly into your config)

[colors.primary]
background = "0xF1ECEC"
foreground = "0x211E1E"

[colors.cursor]
text   = "0x211E1E"
cursor = "0xD68C27"

[colors.selection]
text       = "0x211E1E"
background = "0xD68C27"

[colors.normal]
black   = "0x4B4646"
red     = "0xB52A30"
green   = "0x257A3E"
yellow  = "0x7A5B00"
blue    = "0x2968C3"
magenta = "0x7651B5"
cyan    = "0x1E6E79"
white   = "0x211E1E"

[colors.bright]
black   = "0x8A8585"
red     = "0xB52A30"
green   = "0x257A3E"
yellow  = "0x7A5B00"
blue    = "0x2968C3"
magenta = "0x7651B5"
cyan    = "0x1E6E79"
white   = "0x1A1A1A"
