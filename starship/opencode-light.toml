# OpenCode Light — starship prompt
# Usage: cp starship/opencode-light.toml ~/.config/starship.toml

format = """$username$hostname$directory$git_branch$git_status$python$rust$nodejs$golang$cmd_duration$line_break$character"""

[character]
success_symbol = "[\u276f](bold #8A5200) "
error_symbol = "[\u276f](bold #B52A30) "
vimcmd_symbol = "[\u276f](bold #1E6E79) "

[username]
show_always = false
style_user = "bold #211E1E"
style_root = "bold #B52A30"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "#6B6666"

[directory]
style = "bold #211E1E"
truncation_length = 3
read_only = " \uf023"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bold #7651B5"
format = "[$symbol$branch]($style) "

[git_status]
style = "#257A3E"
conflicted = "=\uf071 "
up_to_date = ""
untracked = "?\uf059 "
ahead = "\U000f0788\ufe0e "
behind = "\U000f0786\ufe0e "
diverged = "\uf126 "
deleted = "\uf00d "
renamed = "\uf039 "
modified = "\uf111 "
stashed = "\uf692 "
format = "([$all_status$ahead_behind]($style)) "

[cmd_duration]
min_time = 2000
style = "#6B6666"
format = "took [$duration]($style) "

[python]
symbol = "\uf235 "
style = "bold #7A5B00"
format = "[$symbol$version]($style) "

[rust]
symbol = "\ue7a8 "
style = "bold #8A5200"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "\uf898 "
style = "bold #257A3E"
format = "[$symbol$version]($style) "

[golang]
symbol = "\ue626 "
style = "bold #1E6E79"
format = "[$symbol$version]($style) "
