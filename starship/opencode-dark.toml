# OpenCode Dark — starship prompt
# Usage: cp starship/opencode-dark.toml ~/.config/starship.toml

format = """$username$hostname$directory$git_branch$git_status$python$rust$nodejs$golang$cmd_duration$line_break$character"""

[character]
success_symbol = "[\u276f](bold #FAB283) "
error_symbol = "[\u276f](bold #E06C75) "
vimcmd_symbol = "[\u276f](bold #56B6C2) "

[username]
show_always = false
style_user = "bold #CFCECD"
style_root = "bold #E06C75"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "#8A8585"

[directory]
style = "bold #E9E8E7"
truncation_length = 3
read_only = " \uf023"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bold #9D7CD8"
format = "[$symbol$branch]($style) "

[git_status]
style = "#7FD88F"
conflicted = "=\uf071 "
up_to_date = ""
untracked = "?\uf059 "
ahead = "\U000f0788\ufe0e "
behind = "\U000f0786\ufe0e "
diverged = "\uf126 "
deleted = "\uf00d "
renamed = "\uf039 "
modified = "\uf111 "
stashed = "\uf692 "
format = "([$all_status$ahead_behind]($style)) "

[cmd_duration]
min_time = 2000
style = "#8A8585"
format = "took [$duration]($style) "

[python]
symbol = "\uf235 "
style = "bold #E5C07B"
format = "[$symbol$version]($style) "

[rust]
symbol = "\ue7a8 "
style = "bold #F5A742"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "\uf898 "
style = "bold #7FD88F"
format = "[$symbol$version]($style) "

[golang]
symbol = "\ue626 "
style = "bold #56B6C2"
format = "[$symbol$version]($style) "
